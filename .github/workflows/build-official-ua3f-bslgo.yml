name: Build Official + UA3F + BSLGo (360T6GS)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write

    steps:
    - name: 初始化编译环境
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev \
          file wget subversion ccache xsltproc libxml-parser-perl binutils
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: 拉取 ImmortalWrt 25.12 源码
      run: |
        git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git -b openwrt-25.12 openwrt
        echo "OPENWRT_PATH=$PWD/openwrt" >> $GITHUB_ENV

    - name: 写入 360T6GS 设备定义（用户原件，从仓库拉取，一字不改）
      run: |
        set -e
        cd $OPENWRT_PATH
        # ========== 1. 设备树: 用户上传原件 (NAND UBI, kernel 4MB + UBI 122MB) ==========
        curl -sL -o target/linux/ramips/dts/mt7621_qihoo_360t6gs.dts \
          "https://raw.githubusercontent.com/whyyds2931/openwrt/openwrt-24.10/target/linux/ramips/dts/mt7621_qihoo_360t6gs.dts"
        # ========== 2. mt7621.mk 360T6GS 定义块: 用户上传原件, 追加到源码 mk 末尾 ==========
        curl -sL -o /tmp/qihoo360.mk \
          "https://raw.githubusercontent.com/whyyds2931/openwrt/openwrt-24.10/target/linux/ramips/image/mt7621_360t6gs.mk"
        cat /tmp/qihoo360.mk >> target/linux/ramips/image/mt7621.mk
        echo "=== 校验用户原件 ==="
        grep -c "qihoo_360t6gs" target/linux/ramips/image/mt7621.mk
        # 关键校验: dts 必须是用户 NAND UBI 版 (kernel 4MB + UBI), 而非仓库老 SPI-NOR 版
        if grep -q "linux,ubi" target/linux/ramips/dts/mt7621_qihoo_360t6gs.dts; then
          echo "[OK] dts 为 NAND UBI 版 (用户原件)"
        else
          echo "[ERROR] dts 不是 NAND UBI 版, 立即终止"
          exit 1
        fi
        grep -n "linux,ubi\|partition@180000" target/linux/ramips/dts/mt7621_qihoo_360t6gs.dts | head -3
        # ========== 3. platform.sh 注册 NAND sysupgrade (源码层, 非用户文件) ==========
        python3 - <<'PY_EOF'
        p = 'target/linux/ramips/mt7621/base-files/lib/upgrade/platform.sh'
        s = open(p).read()
        anchor = '\tnetgear,wax202|\\\n'
        assert anchor in s, 'platform.sh anchor not found'
        s = s.replace(anchor, anchor + '\tqihoo,360t6gs|\\\n', 1)
        open(p, 'w').write(s)
        print('[OK] platform.sh patched')
        PY_EOF
        # ========== 4. 首次启动网络配置 (DSA: lan1-3 + wan) ==========
        mkdir -p files/etc/uci-defaults
        cat > files/etc/uci-defaults/99-360t6gs-network <<'UCI_EOF'
        #!/bin/sh
        # Qihoo 360T6GS 网络: lan1 lan2 lan3 + wan (DSA bridge)
        uci -q batch <<-EOT
        	delete network.lan
        	set network.lan=interface
        	set network.lan.proto='static'
        	set network.lan.device='br-lan'
        	set network.lan.ipaddr='192.168.1.1'
        	set network.lan.netmask='255.255.255.0'
        	delete network.wan
        	set network.wan=interface
        	set network.wan.proto='dhcp'
        	set network.wan.device='wan'
        	set network.@device[0].name='br-lan'
        	set network.@device[0].type='bridge'
        	set network.@device[0].ports='lan1 lan2 lan3'
        	commit network
        EOT
        exit 0
        UCI_EOF
        chmod +x files/etc/uci-defaults/99-360t6gs-network
        echo "[OK] 设备定义写入完成"

    - name: 集成 UA3F（官方教程方式：源码编译，不压缩不UPX）
      run: |
        set -e
        cd $OPENWRT_PATH
        # 官方教程: git clone UA3F 源码到 package/UA3F, 由 OpenWrt 源码编译
        git clone --depth=1 https://github.com/SunBK201/UA3F.git package/UA3F
        cd package/UA3F
        # OpenWrt 只扫描 package/*/Makefile, 官方 Makefile 位于 openwrt/ 子目录
        # 将 openwrt/ 内容提升到包根目录, 修正相对路径 (../go.mod -> ./go.mod)
        cp -r openwrt/* .
        rm -rf openwrt
        sed -i 's|\.\./go\.mod|./go.mod|; s|\.\./go\.sum|./go.sum|; s|\.\./main\.go|./main.go|; s|\.\./cmd|./cmd|; s|\.\./internal|./internal|' Makefile
        # 后端检测补丁: ImmortalWrt 25.12 的 TPROXY 内核模块包名是 kmod-nf-tproxy
        # (UA3F 只检测旧包名 kmod-nft-tproxy 会误判未安装 -> 退化为 iptables 后端)
        sed -i 's/daemon.IsPackageInstalled("kmod-nft-tproxy")/daemon.IsPackageInstalled("kmod-nft-tproxy") || daemon.IsPackageInstalled("kmod-nf-tproxy")/' internal/netfilter/firewall.go
        echo "=== 验证补丁 ==="
        grep -n "kmod-nf-tproxy" internal/netfilter/firewall.go
        echo "=== 验证 Makefile ==="
        grep -n "Package/ua3f" Makefile
        echo "[OK] UA3F 源码集成完成 (未做任何压缩)"

    - name: 注入 BitSrunLoginGo（深澜自动登录，不压缩）
      run: |
        set -e
        cd $OPENWRT_PATH
        wget -q https://github.com/Mmx233/BitSrunLoginGo/releases/download/v1.6.8/bitsrun_linux_mipsle.tar.gz -O bslgo.tar.gz
        rm -rf bslgo-unpack && mkdir bslgo-unpack
        tar xzf bslgo.tar.gz -C bslgo-unpack
        mkdir -p files/usr/bin files/etc/init.d files/etc/config
        cp bslgo-unpack/bitsrun files/usr/bin/BitSrunLoginGo
        chmod +x files/usr/bin/BitSrunLoginGo

        cat > files/etc/init.d/BitSrunLogin <<'INIT_EOF'
        #!/bin/sh /etc/rc.common
        # BitSrunLoginGo 深澜校园网自动登录
        # 配置: /etc/config/BitSrunLoginGo.yaml
        START=95
        STOP=10
        USE_PROCD=1
        PROG=/usr/bin/BitSrunLoginGo
        CONF=/etc/config/BitSrunLoginGo.yaml
        start_service() {
            [ -f "$CONF" ] || return 0
            procd_open_instance
            procd_set_param command "$PROG" --config="$CONF" --daemon
            procd_set_param respawn
            procd_set_param stdout 1
            procd_set_param stderr 1
            procd_close_instance
        }
        stop_service() {
            procd_kill "$PROG" 2>/dev/null
        }
        INIT_EOF
        chmod +x files/etc/init.d/BitSrunLogin

        cat > files/etc/config/BitSrunLoginGo.yaml <<'YAML_EOF'
        # BitSrunLoginGo 深澜校园网自动登录配置
        # 修改下方 username/password/host 后保存
        # 启用: /etc/init.d/BitSrunLogin enable && /etc/init.d/BitSrunLogin start
        username: "你的学号"
        password: "你的密码"
        host: "192.168.168.168"
        port: 2060
        https: false
        timeout: 10
        auto_retry: true
        auto_retry_delay: 60
        auto_retry_times: 0
        daemon: true
        syslog: false
        log_level: 2
        skip_cert_verify: false
        disable_auto_login: false
        YAML_EOF
        echo "[OK] BitSrunLoginGo: $(du -h files/usr/bin/BitSrunLoginGo | cut -f1) (未压缩)"

    - name: 更新 feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 生成编译配置（官方默认 + UA3F 源码包 + 官方教程依赖）
      run: |
        cd $OPENWRT_PATH
        # 1) 先选目标设备，生成官方默认配置（不删除任何官方默认组件）
        echo "CONFIG_TARGET_ramips=y" > .config
        echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
        echo "CONFIG_TARGET_ramips_mt7621_DEVICE_qihoo_360t6gs=y" >> .config
        make defconfig 2>&1 | tail -3
        # 2) 在官方默认基础上仅追加: UA3F 源码包及其官方教程依赖
        cat >> .config <<'ADD_EOF'
        # --- 官方教程: LuCI ---
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-compat=y
        # --- UA3F 源码包 (官方教程: Network->Web Servers/Proxies->ua3f) ---
        CONFIG_PACKAGE_ua3f=y
        # --- 官方教程依赖: 防 TTL + ipset + conntrack ---
        CONFIG_PACKAGE_ipset=y
        CONFIG_PACKAGE_iptables=y
        CONFIG_PACKAGE_iptables-mod-tproxy=y
        CONFIG_PACKAGE_iptables-mod-extra=y
        CONFIG_PACKAGE_iptables-mod-ipopt=y
        CONFIG_PACKAGE_iptables-mod-nfqueue=y
        CONFIG_PACKAGE_iptables-mod-conntrack-extra=y
        CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y
        CONFIG_PACKAGE_kmod-ipt-tproxy=y
        CONFIG_PACKAGE_kmod-ipt-ipopt=y
        # --- 25.12 关键: UA3F nft 后端必需的内核模块 ---
        # kmod-nft-tproxy = nft_tproxy.ko (nft 表达式, UA3F 检测并加载规则必需)
        # kmod-nf-tproxy  = nf_tproxy.ko (tproxy 核心, 被 kmod-nft-tproxy 依赖自动带入)
        CONFIG_PACKAGE_kmod-nft-tproxy=y
        CONFIG_PACKAGE_kmod-nf-tproxy=y
        # --- 用户新增: 宿舍优化 + 异地组网 + 代理 + 终端 + 主题 ---
        CONFIG_PACKAGE_luci-app-wol=y
        CONFIG_PACKAGE_luci-app-upnp=y
        CONFIG_PACKAGE_luci-app-autoreboot=y
        CONFIG_PACKAGE_tailscale=y
        CONFIG_PACKAGE_luci-app-tailscale=y
        CONFIG_PACKAGE_sing-box=y
        CONFIG_PACKAGE_luci-app-sing-box=y
        CONFIG_PACKAGE_luci-app-ttyd=y
        CONFIG_PACKAGE_luci-theme-argon=y
        CONFIG_PACKAGE_luci-app-argon-config=y
        # --- 关键修复: 取消 ucode wifi-scripts (25.12 已知 bug: phy_capabilities.ht_capa
        # 报错导致 5G radio 反复 setup/teardown、无线无法启动), 回退稳定的 shell 版 ---
        # CONFIG_WIFI_SCRIPTS_UCODE is not set
        ADD_EOF
        sed -i 's/^[[:space:]]*//' .config
        make defconfig 2>&1 | tail -3
        # 保险: defconfig 后若仍被恢复为 y, 强制取消 (make 编译阶段不会重新生成 .config)
        sed -i 's/^CONFIG_WIFI_SCRIPTS_UCODE=y$/# CONFIG_WIFI_SCRIPTS_UCODE is not set/' .config
        echo "=== 关键配置验证 ==="
        grep -E "CONFIG_TARGET_ramips_mt7621_DEVICE_qihoo_360t6gs=|CONFIG_PACKAGE_ua3f=|CONFIG_PACKAGE_kmod-nft-tproxy=|CONFIG_PACKAGE_kmod-nf-tproxy=|CONFIG_PACKAGE_kmod-ipt-tproxy=|CONFIG_PACKAGE_kmod-ipt-ipopt=|CONFIG_PACKAGE_ipset=|CONFIG_PACKAGE_luci=|CONFIG_PACKAGE_tailscale=|CONFIG_PACKAGE_luci-app-sing-box=|CONFIG_PACKAGE_luci-app-ttyd=|CONFIG_PACKAGE_luci-theme-argon=|CONFIG_PACKAGE_luci-app-wol=|CONFIG_PACKAGE_luci-app-upnp=|CONFIG_PACKAGE_luci-app-autoreboot=|CONFIG_WIFI_SCRIPTS_UCODE" .config || true

    - name: 下载依赖包
      run: |
        cd $OPENWRT_PATH
        make download -j$(nproc) 2>&1 | tail -5 || make download -j1 V=s
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      run: |
        cd $OPENWRT_PATH
        make -j$(($(nproc) + 1)) 2>&1 | tail -20 || make -j1 V=s

    - name: 整理产物
      run: |
        set -e
        cd $OPENWRT_PATH/bin/targets/ramips/mt7621
        echo "=== 编译产物 ==="
        ls -lh *.bin
        for f in *.bin; do
          S=$(stat -c%s "$f")
          echo "$f: $((S/1024/1024))MB ($S bytes)"
        done

    - name: 上传固件
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_firmware
        path: ${{ env.OPENWRT_PATH }}/bin/targets/ramips/mt7621/*.bin
        retention-days: 14
