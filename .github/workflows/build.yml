name: Build OpenWrt 24.10 Qihoo 360 T6GS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file qemu-utils

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add UA3F package (校园网UA伪装)
        run: |
          git clone https://github.com/SunBK201/UA3F.git package/UA3F

      - name: Enable BBR sysctl (网络拥塞控制)
        run: |
          mkdir -p files/etc/sysctl.d
          cat > files/etc/sysctl.d/99-bbr.conf << 'EOF'
          net.core.default_qdisc=fq
          net.ipv4.tcp_congestion_control=bbr
          EOF

      - name: Generate .config
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_qihoo_360t6gs=y

          # BBR 拥塞控制内核模块
          CONFIG_PACKAGE_kmod-tcp-bbr=y

          # 深澜校园网自动登录
          CONFIG_PACKAGE_bitsrunlogin-go=y

          # UA3F 校园网UA伪装
          CONFIG_PACKAGE_ua3f=y

          # LuCI 精简（仅基础中文）
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl-openssl=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_LUCI_LANG_zh_Hans=y
          EOF
          make defconfig

      - name: Check device and packages selected
        run: |
          echo "=== 设备选择确认 ==="
          grep -E "CONFIG_TARGET_ramips_mt7621_DEVICE_qihoo_360t6gs=" .config || true
          echo "=== 插件确认 ==="
          grep -E "CONFIG_PACKAGE_(ua3f|bitsrunlogin-go|kmod-tcp-bbr)=" .config || true
          echo "=== 默认设备 ==="
          grep -E "CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_" .config | head -20

      - name: Download packages
        run: |
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: |
            bin/targets/ramips/mt7621/*.bin
            bin/targets/ramips/mt7621/*.manifest
            bin/targets/ramips/mt7621/*.itb
            bin/targets/ramips/mt7621/*.img
          if-no-files-found: warn
